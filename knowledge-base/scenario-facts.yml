# Scenario Fact Manifests
#
# PURPOSE
# Every number, threshold, and absolute claim in a report must cite a fact ID from
# this file. This replaces self-attestation — an earlier version let a report write
# "(given)" next to an invented requirement and pass, because the marker was checked
# by the same untrusted document that made the claim.
#
# A claim is only "given" if it appears HERE, with a verbatim source quote.
#
# CRITICAL DISTINCTION
# `facts` are scenario constraints. `teaching_examples` are illustrations the course
# uses to show HOW to write a measure — they are NOT requirements of any scenario.
# Promoting a teaching example into a scenario fact is a fabrication. This actually
# happened: "zero event loss" is a course example of a well-formed measure, and it
# was written into the Retail IoT report labelled "(given)".
#
# `unknowns` are things a reader might expect to be specified but which are NOT.
# Citing an unknown is only valid inside an Open Questions section.

scenarios:

  # =========================================================================
  - id: customer-360
    name: "Customer 360 Capstone"
    source: "TF1 deck, slide 23 (knowledge-base/TF1_*.pdf); see tf1-course-notes.md"
    facts:
      - id: C360-F01
        value: "dashboards ready by 07:00"
        subject: "dashboard|morning|ready|report|batch|sla|business hours|daily|deadline|bounded"
        matches: "7[:.]?0?0?\s*(AM|am)?"
        quote: "Daily dashboards must be ready by 7:00 AM"
      - id: C360-F02
        value: "Marketing tolerates several hours of latency"
        matches: "(several\s+)?hours?"
        quote: "Marketing data can tolerate several hours of latency"
        note: "Deliberately imprecise in the source. Do NOT convert to a number."
      - id: C360-F03
        value: "Customer Service data within 15 minutes"
        subject: "freshness|latency|service|sla|within|updated|refresh|propagat|pipeline|tolerance|tiered|bounded"
        matches: "15\s*(minutes?|min)"
        quote: "Customer Service interactions available within 15 minutes"
        note: "A latency bound ONLY. No attainment percentile is given."
      - id: C360-F04
        value: "data contains PII and sensitive information"
        quote: "Customer data contains PII and sensitive information"
      - id: C360-F05
        value: "3x interaction growth within 2 years"
        matches: "(3x|3\s*times|2\s*years?)"
        quote: "Customer interactions expected to grow 3x within 2 years"
      - id: C360-F06
        value: "2-4 new sources per year"
        matches: "2\s*[-–—]\s*4"
        quote: "2-4 new sources/year expected"
      - id: C360-F07
        value: "a standard source onboarded within 2 weeks"
        subject: "onboard|source|integrat|ingest|new source|sla"
        matches: "2\s*(weeks?|wks?)"
        quote: "a standard source should be onboarded within 2 weeks"
      - id: C360-F08
        value: "controlled and auditable access required"
        quote: "requiring controlled and auditable access"
      - id: C360-F09
        value: "first production release within 4 months"
        subject: "release|launch|production|go live|delivery|timeline|milestone|bounded"
        matches: "4\s*months?"
        quote: "First production release required within 4 months"
      - id: C360-F10
        value: "costs must remain observable as usage grows"
        quote: "Infrastructure and processing costs must remain observable as usage grows"
        note: "Observability, NOT an efficiency target and NOT a budget ceiling."
      - id: C360-F11
        value: "20M customers"
        matches: "20M"
        quote: "20M customers"
      - id: C360-F12
        value: "5M interactions/day"
        matches: "5M"
        quote: "5M interactions/day"
      - id: C360-F13
        value: "4 initial source systems"
        matches: "4\+?\s*(initial\s*)?(source\s*)?(systems?|sources?)"
        quote: "4 initial source systems"
      - id: C360-F14
        value: "3 years of historical data"
        matches: "3\s*years?"
        quote: "3 years of historical data"
      - id: C360-F15
        value: "4 fragmented sources: e-commerce, loyalty, support tickets, marketing"
        quote: "Customer information is fragmented across: E-commerce orders, Loyalty program activity, Customer support tickets, Marketing interactions"
        verbatim: false
        note: "Bullet list joined into one line. All 14 distinctive tokens verified present in the source; the colon and comma joins are editorial, not quoted punctuation. Every other entry in this manifest is exact verbatim."
      - id: C360-F16
        value: "teams spend significant time reconciling inconsistent customer information"
        quote: "Business teams currently spend significant time reconciling inconsistent customer information across systems."
      - id: C360-F18
        value: "interactions expected to grow 3x within 2 years"
        matches: "3\s*[x×]|within\s*2\s*years?"
        quote: "Customer interactions expected to grow 3x within 2 years"
      - id: C360-F17
        value: "Data Science needs reliable historical data for churn and propensity models"
        quote: "Data Science: reliable historical data for churn and propensity models"
    unknowns:
      - id: C360-U01
        topic: "attainment percentile / measurement window for the 15-minute SLA"
      - id: C360-U02
        topic: "precise latency bound for Marketing"
      - id: C360-U03
        topic: "acceptable disruption to existing pipelines during onboarding"
      - id: C360-U04
        topic: "budget ceiling or unit-cost target"
      - id: C360-U05
        topic: "applicable compliance regime (GDPR/CCPA/other) and data residency"
      - id: C360-U06
        topic: "whether failed quality checks block the pipeline or alert only"
      - id: C360-U08
        topic: "target match accuracy and tolerance for false merges in identity resolution"
      - id: C360-U07
        topic: "existing platform commitment, if any"

  # =========================================================================
  - id: retail-iot
    name: "Scenario A - Retail IoT Monitoring Platform"
    source: "TF1 deck; see tf1-course-notes.md lines ~126-144"
    facts:
      - id: RIOT-F01
        value: "500 stores with IoT devices"
        matches: "500\s*stores?"
        quote: "A retail company operates 500 stores with IoT devices generating continuous telemetry"
      - id: RIOT-F02
        value: "50K events/sec peak"
        matches: "50K\s*events?"
        quote: "50K events/sec peak ingestion bursts during business hours"
      - id: RIOT-F03
        value: "p95 ingestion latency < 200ms"
        subject: "latency|ingest|p95|peak"
        matches: "(200\s*ms|p95)"
        quote: "p95 ingestion latency < 200ms during peak load"
      - id: RIOT-F04
        value: "recovery from single-AZ failure in < 30 sec"
        subject: "recover|failover|availability zone|outage|restore|rto"
        matches: "30\s*(sec|seconds?)"
        quote: "Recovery from a single availability-zone failure in <30 sec"
        note: "A RECOVERY TIME only. No durability/data-loss target is given."
      - id: RIOT-F05
        value: "deploy a new event schema without pipeline downtime, < 1 day"
        matches: "(1\s*day|downtime)"
        quote: "Deploy a new event schema without pipeline downtime, <1 day"
        note: "'without pipeline downtime' IS given here and may be stated."
      - id: RIOT-F06
        value: "identifiers require controlled access"
        quote: "Events may contain device/store/customer/loyalty identifiers requiring controlled access"
      - id: RIOT-F07
        value: "device count grows with expansion to new regions"
        quote: "Device count is expected to grow as the platform expands to new regions"
      - id: RIOT-F08
        value: "team has strong batch experience but limited streaming experience"
        quote: "The delivery team has strong batch-processing experience but limited streaming experience"
    teaching_examples:
      - id: RIOT-X01
        value: "zero event loss"
        quote: "Example measure: p95 ingestion latency < 200ms with zero event loss."
        warning: >
          This is the course illustrating how to WRITE a measure. It is not listed in
          Scenario A's operating conditions. Citing it as a scenario requirement is a
          fabrication. If durability matters, raise it as an open question.
    unknowns:
      - id: RIOT-U01
        topic: "tolerable data loss during AZ failover"
      - id: RIOT-U02
        topic: "retention period for raw telemetry"
      - id: RIOT-U03
        topic: "budget ceiling for regional expansion"
      - id: RIOT-U04
        topic: "specific access-control policy for identifiers"
      - id: RIOT-U06
        topic: "ordering scope, replay window and acknowledgement semantics for event ingestion"
      - id: RIOT-U07
        topic: "whether the firmware team can accept a blocking schema-compatibility check before release"
      - id: RIOT-U05
        topic: "data residency / regulatory constraints per region"
