  # =========================================================================
  - id: retail-iot
    name: "Scenario A - Retail IoT Monitoring Platform"
    source: "TF1 deck; see tf1-course-notes.md lines ~126-144"
    source_files:
      - "TF1_architectural-foundations-quality-attributes_instructor_slalom.pdf"
      - "tf1-course-notes.md"
    facts:
      - id: RIOT-F01
        value: "500 stores with IoT devices"
        matches: '500\s*stores?'
        quote: "A retail company operates 500 stores with IoT devices generating continuous telemetry"
      - id: RIOT-F02
        value: "50K events/sec peak"
        matches: '50K\s*events?'
        quote: "50K events/sec peak ingestion bursts during business hours"
      - id: RIOT-F03
        value: "p95 ingestion latency < 200ms"
        subject: "latency|ingest|p95|peak"
        matches: '(200\s*ms|p95)'
        quote: "p95 ingestion latency < 200ms during peak load"
      - id: RIOT-F04
        value: "recovery from single-AZ failure in < 30 sec"
        subject: "recover|failover|availability zone|outage|restore|rto"
        matches: '30\s*(sec|seconds?)'
        quote: "Recovery from a single availability-zone failure in <30 sec"
        note: "A RECOVERY TIME only. No durability/data-loss target is given."
      - id: RIOT-F05
        value: "deploy a new event schema without pipeline downtime, < 1 day"
        matches: '(1\s*day|downtime)'
        quote: "Deploy a new event schema without pipeline downtime, <1 day"
        note: "'without pipeline downtime' IS given here and may be stated."
      - id: RIOT-F06
        value: "identifiers require controlled access"
        quote: "Events may contain device/store/customer/loyalty identifiers requiring controlled access"
      - id: RIOT-F07
        value: "device count grows with expansion to new regions"
        quote: "Device count is expected to grow as the platform expands to new regions"
      - id: RIOT-F08
        value: "team has strong batch experience but limited streaming experience"
        quote: "The delivery team has strong batch-processing experience but limited streaming experience"
    teaching_examples:
      - id: RIOT-X01
        value: "zero event loss"
        quote: "Example measure: p95 ingestion latency < 200ms with zero event loss."
        warning: >
          This is the course illustrating how to WRITE a measure. It is not listed in
          Scenario A's operating conditions. Citing it as a scenario requirement is a
          fabrication. If durability matters, raise it as an open question.
    unknowns:
      - id: RIOT-U01
        topic: "tolerable data loss during AZ failover"
      - id: RIOT-U02
        topic: "retention period for raw telemetry"
      - id: RIOT-U03
        topic: "budget ceiling for regional expansion"
      - id: RIOT-U04
        topic: "specific access-control policy for identifiers"
      - id: RIOT-U06
        topic: "ordering scope, replay window and acknowledgement semantics for event ingestion"
      - id: RIOT-U07
        topic: "whether the firmware team can accept a blocking schema-compatibility check before release"
      - id: RIOT-U05
        topic: "data residency / regulatory constraints per region"

  # =========================================================================
  - id: verdant-grocers
    name: "Verdant Grocers - Near-Real-Time Inventory Visibility"
    source: "GitHub issue #8 + PR comments 5818993306 and 5820970476"
    # Quotes for this scenario are verified ONLY against the file below, which is
    # a verbatim capture of the GitHub issue and comments. Its hash is pinned in
    # knowledge-base/provenance.lock and re-checked against the live GitHub API.
    source_files:
      - "sources/verdant-grocers.source.txt"
    source_issue: 8
    source_comments: [5818993306, 5820970476]
    facts:
      - id: VGI-F01
        value: "140 stores"
        matches: '140\s*stores?'
        quote: "140 stores across three states."
      - id: VGI-F02
        value: "three states"
        quote: "140 stores across three states."
      - id: VGI-F03
        value: "point-of-sale terminals already emit a transaction event per basket"
        quote: "Each store has point-of-sale terminals that already emit a transaction event per basket."
      - id: VGI-F04
        value: "events reach an on-premises message broker today"
        quote: "The events reach an on-premises message broker today."
      - id: VGI-F05
        value: "roughly 900,000 basket events per day with a weekday-evening peak"
        matches: '900,?000'
        quote: "Roughly 900,000 basket events per day across the chain, with a pronounced weekday-evening peak."
      - id: VGI-F06
        value: "stock positions visible within a few minutes of a sale"
        subject: "inventory|stock|minutes|sale|freshness|replenishment|visible"
        quote: "The merchandising team wants store-level stock positions visible \"within a few minutes\" of a sale, and has said that a figure closer to one minute would change how they staff replenishment."
        note: "Deliberately imprecise in the source. Do NOT convert this to a numeric SLA."
      - id: VGI-F07
        value: "closer to one minute would change replenishment staffing"
        matches: 'one\s*minute|1\s*minute'
        subject: "minute|staff|staffing|replenishment|freshness"
        quote: "The merchandising team wants store-level stock positions visible \"within a few minutes\" of a sale, and has said that a figure closer to one minute would change how they staff replenishment."
        note: "A business-impact threshold, not the current requirement."
      - id: VGI-F08
        value: "existing overnight batch warehouse that finance depends on"
        quote: "There is an existing overnight batch warehouse that finance depends on."
      - id: VGI-F09
        value: "batch warehouse cannot be switched off"
        quote: "It cannot be switched off, and finance's monthly close must not regress."
      - id: VGI-F10
        value: "finance's monthly close must not regress"
        quote: "It cannot be switched off, and finance's monthly close must not regress."
      - id: VGI-F11
        value: "two full-time data engineers"
        quote: "The company has two full-time data engineers."
      - id: VGI-F12
        value: "no platform team"
        quote: "There is no platform team."
      - id: VGI-F13
        value: "leadership does not want to be locked into one vendor"
        quote: "Leadership has said it does not want to be \"locked into one vendor\", but has not defined what that means in practice."
      - id: VGI-F14
        value: "vendor lock-in concern is not defined in practice"
        quote: "Leadership has said it does not want to be \"locked into one vendor\", but has not defined what that means in practice."
      - id: VGI-F15
        value: "a product that sells out at 10 AM is not visible as out-of-stock until the next morning"
        matches: '10\s*AM|next\s*morning'
        subject: "out-of-stock|next morning|sell|sells|inventory|stock"
        quote: "Store managers currently reorder from a report that is refreshed overnight, so a product that sells out at 10 AM is not visible as out-of-stock to the replenishment team until the next morning."
      - id: VGI-F16
        value: "each POS terminal keeps a local journal of every basket it rings, retained for 72 hours"
        matches: '72\s*hours?'
        quote: "Each POS terminal keeps a local journal of every basket it rings, retained for 72 hours."
      - id: VGI-F17
        value: "if the streaming path drops events during an outage, the journal is re-sent in the overnight batch and finance reconciles from that"
        quote: "If the streaming path drops events during an outage, the journal is re-sent in the overnight batch and finance reconciles from that."
      - id: VGI-F18
        value: "the business tolerates loss of up to roughly 15 minutes of basket events from the near-real-time inventory view during an outage, provided the loss is visible to merchandising and is corrected by the next morning"
        matches: '15\s*minutes?|next\s*morning'
        subject: "minutes|outage|near-real-time|inventory view|visible|merchandising|next morning|loss"
        quote: "The business therefore tolerates loss of up to roughly 15 minutes of basket events from the near-real-time inventory view during an outage, provided the loss is visible to merchandising and is corrected by the next morning."
      - id: VGI-F19
        value: "cloud run-rate ceiling of USD 8,000 per month for the new platform, excluding the existing overnight warehouse"
        matches: '8,000'
        subject: "budget|cost|run-rate|cloud|month|platform"
        quote: "A cloud run-rate ceiling of USD 8,000 per month for the new platform, excluding the existing overnight warehouse, which is budgeted separately."
      - id: VGI-F20
        value: "PCI DSS applies to the POS transaction stream"
        quote: "PCI DSS applies to the POS transaction stream."
      - id: VGI-F21
        value: "cardholder data must never land in the analytics platform and must be removed or tokenised before events leave the store network"
        subject: "cardholder|analytics|tokenised|tokenized|store network|pci|remove"
        quote: "Cardholder data must never land in the analytics platform; it has to be removed or tokenised before the events leave the store network."
    unknowns:
      - id: VGI-U04
        topic: "what 'not locked into one vendor' means in practice"

  # =========================================================================
  - id: solstice-health
    name: "Solstice Health - Referral Routing & Specialist Queueing"
    source: "GitHub issue #12"
    # Quotes for this scenario are verified ONLY against the file below, which is
    # a verbatim capture of the GitHub issue. Its hash is pinned in
    # knowledge-base/provenance.lock and re-checked against the live GitHub API.
    source_files:
      - "sources/solstice-health.source.txt"
    source_issue: 12
    facts:
      - id: SOLH-F01
        value: "12 primary-care clinics"
        matches: '12\s*(primary-care\s*)?clinics?'
        subject: "clinic|network|health"
        quote: "Solstice Health is a regional nonprofit health network with 12 primary-care clinics."
      - id: SOLH-F02
        value: "referral time cut from multi-day to same-day"
        quote: "Cut the time from \"referral submitted\" to \"referral visible in the specialist's queue\" from multi-day to same-day."
      - id: SOLH-F03
        value: "combined volume of roughly 4,000 referrals per week across the 12 clinics"
        matches: '4,000'
        subject: "referral|volume|week|throughput|clinics"
        quote: "12 clinics, combined volume of roughly 4,000 referrals per week."
      - id: SOLH-F04
        value: "a referral must reach the correct specialist's queue within 30 minutes of submission"
        matches: '30\s*(minutes?|min)'
        subject: "referral|queue|routing|submission|reach"
        quote: "A referral must reach the correct specialist's queue within 30 minutes of submission."
      - id: SOLH-F05
        value: "system must be available 99.5% of the time during business hours"
        matches: '99\.5\s?%'
        subject: "availab|uptime|business hours|system"
        quote: "The system must be available 99.5% of the time during business hours (7am-7pm local, Monday-Saturday)."
      - id: SOLH-F06
        value: "business hours are defined as 7am-7pm local, Monday-Saturday"
        subject: "business hours|availab|monday|saturday|local"
        quote: "The system must be available 99.5% of the time during business hours (7am-7pm local, Monday-Saturday)."
        note: "No 'matches:' pattern: the value is a compound span (7am AND 7pm), which the value-detection grammar always splits into two separate tokens. A compound pattern can never match either token alone, so this fact relies on presence + subject-proximity checks only."
      - id: SOLH-F07
        value: "referral volume is projected to grow 20% year-over-year for the next 3 years"
        matches: '20\s?%|3\s*years?'
        subject: "growth|grow|volume|year-over-year|project"
        quote: "Referral volume is projected to grow 20% year-over-year for the next 3 years."
      - id: SOLH-F08
        value: "referral and access-log data must be retained for 7 years (state health-record retention law)"
        matches: '7\s*years?'
        subject: "retain|retention|referral|access-log|record|law"
        quote: "Referral and access-log data must be retained for 7 years (state health-record retention law)."
      - id: SOLH-F09
        value: "6-month timeline to first production rollout"
        matches: '6[-\s]month'
        subject: "timeline|rollout|production|deadline"
        quote: "6-month timeline to first production rollout."
      - id: SOLH-F10
        value: "engineering team of 4 engineers, strong in SQL/Python, no prior streaming-systems experience"
        matches: '4\s*engineers?'
        subject: "team|engineer|staff|skill|sql|python|streaming"
        quote: "Engineering team: 4 engineers, strong in SQL/Python, no prior streaming-systems experience."
      - id: SOLH-F11
        value: "first-year infrastructure budget is capped at $250,000"
        matches: '\$\s?250,000'
        subject: "budget|infrastructure|cost|cap|first-year"
        quote: "First-year infrastructure budget is capped at $250,000."
      - id: SOLH-F12
        value: "signed Business Associate Agreement (BAA) with Microsoft Azure and a data-residency requirement that patient data must not leave the contracted Azure region; moving to a different cloud is not an option for this project"
        subject: "azure|cloud|baa|residency|region|data"
        quote: "The organization has a signed Business Associate Agreement (BAA) with Microsoft Azure and a data-residency requirement that patient data must not leave the contracted Azure region. Moving to a different cloud is not an option for this project."
      - id: SOLH-F13
        value: "HIPAA applies; referral records contain PHI"
        quote: "HIPAA applies; referral records contain PHI."
      - id: SOLH-F14
        value: "every read/write access to a referral record must be logged and retained for 7 years"
        matches: '7\s*years?'
        subject: "log|access|read|write|audit|retain|referral"
        quote: "Every read/write access to a referral record must be logged and retained for 7 years."
      - id: SOLH-F15
        value: "access must be restricted by role (referring clinician / specialist / care coordinator)"
        quote: "Access must be restricted by role (referring clinician / specialist / care coordinator)."
      - id: SOLH-F16
        value: "no data warehouse or integration layer exists today; the Excel sheet is the only current system of record for referrals"
        quote: "No data warehouse or integration layer exists today; the Excel sheet is the only current system of record for referrals."
      - id: SOLH-F17
        value: "all 12 clinics emit HL7 v2 ADT feeds today"
        matches: '12\s*clinics?'
        subject: "hl7|adt|feed|clinic|ehr|ingest"
        quote: "Ingest referral-relevant patient data from each clinic's EHR system (all 12 clinics emit HL7 v2 ADT feeds today)."
      - id: SOLH-F18
        value: "no clinic is willing to change EHR vendors for this project"
        quote: "Clinics already emit HL7 v2 ADT feeds from their EHR systems; no clinic is willing to change EHR vendors for this project."
    unknowns:
      - id: SOLH-U01
        topic: "target patient-identity-match accuracy / tolerance for false merges across the 12 clinics"
      - id: SOLH-U02
        topic: "acceptable latency for the care-coordinator notification step specifically (distinct from the 30-minute queue-routing SLA)"
      - id: SOLH-U03
        topic: "disaster-recovery / RTO-RPO expectations, including whether any availability target applies outside the stated 7am-7pm Mon-Sat business hours"
      - id: SOLH-U04
        topic: "attainment percentile (e.g., p95/p99) for the 30-minute routing SLA"
      - id: SOLH-U05
        topic: "whether an HL7 interoperability engine/middleware already exists at any clinic"
      - id: SOLH-U06
        topic: "expected unique-patient population size for identity-resolution scale planning"
      - id: SOLH-U07
        topic: "acceptable data loss / recovery point during an outage of the ingestion pipeline"
      - id: SOLH-U08
        topic: "whether any consumer beyond the three named roles (referring clinician, receiving specialist, care coordinator) will ever need access to referral records"

  # =========================================================================
  - id: northbridge-logistics
    name: "Northbridge Logistics - Fleet Reefer Telemetry & Alerting"
    source: "GitHub issue #14"
    # Quotes for this scenario are verified ONLY against the file below, a verbatim
    # capture of the GitHub issue. Its hash is pinned in knowledge-base/provenance.lock
    # and re-checked against the live GitHub API by scripts/verify_provenance.py.
    source_files:
      - "sources/northbridge-logistics.source.txt"
    source_issue: 14
    facts:
      - id: NBL-F01
        value: "3,200 refrigerated (\"reefer\") trucks fleet-wide"
        subject: "fleet|trucks|reefer|fleet-wide"
        quote: 'Northbridge Logistics operates a fleet of 3,200 refrigerated ("reefer") trucks.'
      - id: NBL-F02
        value: "each truck sends telemetry approximately every 30 seconds"
        subject: "telemetry|interval|sending|report|reports|reported|frequency|sends|sent|emit|emits|reading|readings|cadence|second|seconds"
        quote: "3,200 trucks fleet-wide, each sending telemetry approximately every 30 seconds."
      - id: NBL-F03
        value: "alert must reach the fleet manager within 5 minutes of a threshold breach"
        subject: "alert|breach|sla|threshold|minutes|reach"
        matches: '5\s*(minutes?|min)'
        quote: "Alert must reach the fleet manager within 5 minutes of a threshold breach."
      - id: NBL-F04
        value: "telemetry retention: minimum 2 years"
        subject: "retention|historical|store|warranty|years"
        matches: '2\s*years?'
        quote: "Store historical telemetry for at least 2 years to support warranty disputes with the truck/reefer-unit manufacturers."
      - id: NBL-F05
        value: "pilot phase covers 400 trucks"
        subject: "pilot|trucks"
        matches: '400\s*trucks?'
        quote: "Pilot phase: 400 trucks, targeted within 4 months."
      - id: NBL-F06
        value: "pilot targeted within 4 months"
        subject: "pilot|months|targeted|timeline"
        matches: '4\s*months?'
        quote: "Pilot phase: 400 trucks, targeted within 4 months."
      - id: NBL-F07
        value: "team: 6 backend engineers + 1 data engineer, comfortable with Python and SQL; two have prior production Kafka experience"
        quote: "Team: 6 backend engineers + 1 data engineer, comfortable with Python and SQL; two of them have prior production experience with Kafka."
      - id: NBL-F08
        value: "existing on-premises fault-code system cannot be decommissioned yet; warranty-claims team still depends on it; no committed migration date"
        quote: "The existing on-premises fault-code system cannot be decommissioned yet — the warranty-claims team still depends on it and there is no committed migration date."
      - id: NBL-F09
        value: "ingest telemetry (engine temperature, GPS, reefer-unit temperature, fault codes) from each truck's onboard device"
        quote: "Ingest telemetry (engine temperature, GPS, reefer-unit temperature, fault codes) from each truck's onboard device, sent roughly every 30 seconds per truck."
      - id: NBL-F10
        value: "detect when reefer-unit temperature breaches a configured safe-range threshold"
        quote: "Detect when reefer-unit temperature breaches a configured safe-range threshold."
      - id: NBL-F11
        value: "provide a dashboard showing currently active alerts per truck/route"
        quote: "Provide a dashboard showing currently active alerts per truck/route."
      - id: NBL-F12
        value: "reefer-unit temperature thresholds are configured per cargo type by an existing rules engine that will keep being used; this project only consumes its output"
        quote: "The reefer-unit temperature threshold values themselves are configured per cargo type by an existing rules engine that will keep being used; this project only needs to consume its output, not replace it."
      - id: NBL-F13
        value: "fleet managers and warranty-claims staff need different views of the data"
        subject: "fleet managers|warranty-claims|views|roles|access"
        quote: "Fleet managers and warranty-claims staff need different views of the data, but exact role definitions haven't been finalized."
    unknowns:
      - id: NBL-U01
        topic: "applicable regulatory/compliance regime for vehicle telemetry (legal review pending, no determination made)"
      - id: NBL-U02
        topic: "fleet-wide growth-rate projection beyond the current 3,200 trucks"
      - id: NBL-U03
        topic: "budget for this initiative (not disclosed)"
      - id: NBL-U04
        topic: "exact role/permission definitions distinguishing fleet-manager and warranty-claims views"
      - id: NBL-U05
        topic: "cloud vendor or hybrid platform commitment (none chosen; company open to any provider or hybrid)"
      - id: NBL-U06
        topic: "full-fleet rollout timeline after the 400-truck pilot"
      - id: NBL-U07
        topic: "quantified definition of 'near-real-time' for the fleet-manager reefer-health dashboard (Business Objective 2 uses only qualitative wording)"
      - id: NBL-U08
        topic: "whether onboard devices can publish to two independent downstream consumers (device-side fan-out) or whether fan-out to the legacy system must happen network-side"
      - id: NBL-U09
        topic: "acceptable telemetry data-loss tolerance during an ingestion-path or connectivity outage"

