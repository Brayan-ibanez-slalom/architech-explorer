name: "Validate Scenario Report Structure"

# Runs on any PR that adds/changes an HTML report under docs/, to enforce that the
# Definition of Done checklist in .github/copilot-instructions.md was actually followed
# (required sections present) before merge.

on:
  pull_request:
    paths:
      - "docs/*.html"

permissions:
  contents: read

jobs:
  validate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check required sections exist in changed reports
        run: |
          set -e
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'docs/*.html' || true)
          if [ -z "$CHANGED" ]; then
            echo "No docs/*.html files changed."
            exit 0
          fi

          REQUIRED_TERMS=(
            "Objectives"
            "Constraints"
            "Functional"
            "Quality"
            "ASR"
            "Utility Tree"
            "Decisions"
            "Trade-off"
            "Cost of Change"
            "Open Questions"
            "Governance"
          )

          FAIL=0
          for f in $CHANGED; do
            echo "Validating $f ..."
            for term in "${REQUIRED_TERMS[@]}"; do
              if ! grep -qi "$term" "$f"; then
                echo "::error file=$f::Missing required section reference: '$term'"
                FAIL=1
              fi
            done
          done

          if [ "$FAIL" -eq 1 ]; then
            echo "One or more reports are missing required sections per the Definition of Done."
            exit 1
          fi
          echo "All changed reports contain the required sections."
