name: "Agent Quality Review"

# Replaces grep-based validation with an actual AGENT REVIEW of report quality.
#
# Behaviour required by the repo owner:
#   - The agent reviews whether the HTML report genuinely IMPROVED.
#   - If it improved  -> the PR is allowed to proceed (check passes).
#   - If it did NOT   -> the check FAILS, the verdict is posted to the PR,
#                        and the client is told what to iterate on.
#
# The structural check below is a fast pre-filter only. It can prove a report is
# INCOMPLETE, but it can never prove a report is GOOD — that is the reviewer's job.

on:
  pull_request:
    paths:
      # The reports themselves.
      - "docs/*.html"
      # AND the gate that judges them. These were missing, so a PR that changed
      # only the checking scripts ran no checks at all - the gate could be
      # weakened or broken without CI ever noticing. A fix for a flaky-gate bug
      # was the change that exposed this.
      - "scripts/**"
      - "knowledge-base/scenario-facts.yml"
      - ".github/workflows/agent-quality-review.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  structural-prefilter:
    name: "Structural pre-filter (necessary, not sufficient)"
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.files }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed reports
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'docs/*.html' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed reports: $CHANGED"

      - name: Install manifest verification dependency
        run: pip install --quiet pypdf pyyaml
        # Required by scripts/verify_manifest.py. Without it the manifest check
        # degrades to a warning, which would let a fabricated fact through CI.

      - name: Run the SAME gate developers run locally
        if: steps.detect.outputs.files != ''
        env:
          # Needed by scripts/verify_provenance.py, which re-fetches the upstream
          # GitHub issue a scenario's facts were captured from. Without it that
          # check degrades to a warning rather than silently passing.
          GH_TOKEN: ${{ github.token }}
        run: |
          # CI must not diverge from scripts/preflight.sh. A red-team test found
          # reports that passed locally but failed CI (and vice versa) because the
          # two implementations drifted apart. There is now one implementation.
          set -o pipefail
          git diff --name-only -z origin/${{ github.base_ref }}...HEAD -- 'docs/*.html' \
            | xargs -0 -r ./scripts/preflight.sh

  agent-review:
    name: "Agent quality review (improved? -> PR | not improved? -> iterate)"
    needs: structural-prefilter
    # Deliberately NOT gated on changed reports. This job used to skip whenever a
    # PR touched no docs/*.html, which meant changes to the gate scripts - the
    # files that decide what the repo accepts as true - needed no review at all.
    # The first PR to add the independent-review check skipped that very check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Post review instructions to the PR
        if: needs.structural-prefilter.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/review-request.md <<'EOF'
          ## 🔍 Agent Quality Review required

          The structural pre-filter passed — but **that only proves the sections exist, not that the analysis is good.**

          A reviewing agent must now assess whether this report genuinely **improved**, and answer each question below with evidence (quote specific lines):

          1. **Did it genuinely improve, or is it just longer?** Length is not quality.
          2. **Are there FABRICATED requirements?** Check every number against the source scenario in `knowledge-base/`. Anything not given and not flagged as an assumption or Open Question is a failure.
          3. **Is each trade-off REAL** (naming what is given up and which alternative was rejected), or a disguised benefit statement?
          4. **Is vendor neutrality genuine or superficial?** Listing vendor names is not neutrality — is there reasoning about *when* to pick each?
          5. **Is Governance & Security substantive**, or boilerplate that could be pasted into any project?
          6. **Does every decision pass the "¿Para qué?" test** — outcome, objective, and ASR identifiable?
          7. **Any internal inconsistencies**, wrong section references, or contradictions?

          ### Required verdict format
          ```
          VERDICT: IMPROVED | NOT IMPROVED | MIXED
          CONFIDENCE: <1-10>
          TOP 3 REMAINING WEAKNESSES:
          SPECIFIC FIXES RECOMMENDED:
          ```

          ### Decision rule
          - **IMPROVED** → approve; the PR may merge.
          - **MIXED / NOT IMPROVED** → **do not merge.** Report the weaknesses to the client, iterate on the fixes, and push the corrections to this same PR.

          > Run locally with: `/rubber-duck` or the `rubber-duck` agent, pointing it at the changed report(s).
          EOF
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/review-request.md

      # The previous version of this step grepped the PR body for
      # "VERDICT: IMPROVED". The PR author writes the PR body, so the author
      # could certify their own work by typing eight characters. That is not
      # evidence of review; it is evidence of typing.
      #
      # The gates in this repo check sourcing, structure and decision shape.
      # They cannot check whether the reasoning is CORRECT. Only a second
      # party can. So the thing this step now looks for is a second party.
      - name: Require judgement from someone other than the author
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          APPROVERS=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            --jq "[.[] | select(.state == \"APPROVED\") | .user.login] | unique | .[]" \
            | grep -v "^${AUTHOR}$" || true)

          if [ -n "$APPROVERS" ]; then
            echo "Independent approval from: $(echo "$APPROVERS" | tr '\n' ' ')"
            echo "Someone other than the author has judged this. That is the only"
            echo "check in this repository that speaks to CORRECTNESS."
            exit 0
          fi

          # The marker must start a line and carry a real reason.
          #
          # The first version searched the body for the substring anywhere. The
          # very PR that introduced this check then passed it - because the PR
          # description EXPLAINED the escape hatch, and the explanation contained
          # the magic words. The check matched its own documentation.
          #
          # Anchoring to line start excludes the inline-code and prose mentions
          # that any honest description of this rule will contain, and requiring
          # 15+ characters of reason excludes the "<why>" placeholder.
          BODY=$(gh pr view "$PR" --json body -q .body)
          if echo "$BODY" | grep -qE "^NO INDEPENDENT REVIEW: *[^<[:space:]].{14,}"; then
            echo "::warning::Merging without independent review, acknowledged in the PR body."
            echo "The structural gates passed. Nothing has checked whether the"
            echo "reasoning is correct. That is now a recorded, deliberate choice"
            echo "rather than a silent one."
            exit 0
          fi

          echo "::error::No approving review from anyone other than @${AUTHOR}."
          echo "The structural gates prove the report is SOURCED and well-SHAPED."
          echo "They cannot prove it is RIGHT. Either get a second party to"
          echo "approve, or state the trade-off explicitly by adding a line to the"
          echo "PR body: 'NO INDEPENDENT REVIEW: <why this is acceptable here>'."
          exit 1
